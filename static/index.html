<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TaskFlow – AI Task Manager</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body class="bg-page font-sans text-ink antialiased">
    <!-- lg+: the shell is exactly one viewport tall, so only the task list and chat scroll. -->
    <div
      class="mx-auto flex min-h-dvh max-w-380 flex-col p-3 sm:p-5 lg:h-dvh lg:min-h-140 lg:p-6 xl:p-8 2xl:p-10 lg:short:p-3"
    >
      <div
        class="flex min-h-0 flex-1 flex-col overflow-hidden rounded-3xl border-2 border-cardborder bg-white sm:rounded-[28px]"
      >
        <header
          class="flex shrink-0 items-center justify-between gap-x-4 bg-navy px-5 py-4 sm:px-8 sm:py-5 lg:px-9 lg:short:py-2.5"
        >
          <h1
            class="text-2xl font-extrabold tracking-wide text-white sm:text-[32px] lg:short:text-2xl"
          >
            TASKFLOW
          </h1>
          <p class="text-xs font-bold tracking-wide text-navysub sm:text-sm">
            AI TASK MANAGER
          </p>
        </header>

        <main
          class="grid min-h-0 flex-1 gap-5 p-4 sm:p-6 lg:grid-cols-[minmax(0,3fr)_minmax(0,2fr)] lg:grid-rows-[minmax(0,1fr)] lg:gap-6 lg:px-9 lg:pb-9 lg:pt-7 xl:grid-cols-[minmax(0,2fr)_minmax(0,1fr)] lg:short:gap-4 lg:short:pb-4 lg:short:pt-3"
        >
          <!-- Left column -->
          <section class="flex min-h-0 min-w-0 flex-col">
            <div class="shrink-0 lg:ml-2">
              <h2
                class="text-3xl font-extrabold text-heading sm:text-4xl lg:short:text-2xl"
              >
                My tasks
              </h2>
              <p class="mt-1.5 text-sm text-lead sm:text-base lg:short:mt-0.5">
                Organize tasks by asking your AI assistant
              </p>
            </div>

            <div
              id="board-card"
              class="mt-5 flex min-h-0 flex-1 flex-col rounded-3xl border-2 border-boardborder bg-white p-4 transition-shadow duration-500 sm:mt-6 sm:rounded-[28px] sm:p-6 lg:short:mt-3 lg:short:p-4"
            >
              <div
                class="flex shrink-0 flex-wrap items-center justify-between gap-3"
              >
                <h3 class="text-xl font-extrabold text-heading sm:text-2xl">
                  Task board
                </h3>
                <span
                  class="shrink-0 rounded-xl bg-pill px-4 py-2.5 text-sm font-bold text-pilltext sm:px-5 sm:py-3 sm:text-base"
                  >All tasks <span id="task-count" class="ml-1">0</span></span
                >
              </div>
              <ul
                id="task-list"
                class="thin-scroll @container mt-5 min-h-0 flex-1 space-y-3 overflow-y-auto pr-1 lg:short:mt-3 lg:short:space-y-2"
              ></ul>
            </div>
          </section>

          <!-- Right column -->
          <aside
            class="flex min-h-0 min-w-0 flex-col rounded-3xl border-2 border-panelborder bg-panel p-4 sm:rounded-[28px] sm:p-5 lg:short:p-3"
          >
            <div
              class="flex shrink-0 items-center gap-3 rounded-2xl bg-aihead px-5 py-4 lg:short:py-2.5"
            >
              <span class="text-xl text-aititle sm:text-2xl" aria-hidden="true"
                >✦</span
              >
              <h2 class="text-xl font-extrabold text-aititle sm:text-2xl">
                AI Assistant
              </h2>
            </div>
            <p class="mt-3 shrink-0 px-2 text-sm text-aisub lg:short:mt-2">
              Manage everything with a message
            </p>

            <div
              id="chat-log"
              class="thin-scroll mt-2 flex h-85 min-h-35 flex-col gap-3 overflow-y-auto px-1 py-2 sm:h-105 lg:h-auto lg:flex-1"
              aria-live="polite"
            ></div>

            <div
              id="chips"
              class="mt-2 flex shrink-0 gap-2 overflow-x-auto pb-1 thin-scroll"
            ></div>

            <form
              id="chat-form"
              class="relative mt-2 shrink-0 rounded-2xl border-[3px] border-inputborder bg-white px-4 pb-3 pt-3 focus-within:border-send sm:px-5 sm:pb-4 sm:pt-4 lg:short:pb-2.5 lg:short:pt-2.5"
            >
              <label
                for="chat-input"
                class="block text-xs font-extrabold tracking-wide text-label sm:text-sm"
                >Your instruction</label
              >
              <div
                id="slash-menu"
                role="listbox"
                aria-label="Tools"
                hidden
                class="thin-scroll absolute inset-x-0 bottom-full z-20 mb-2 max-h-72 overflow-y-auto rounded-2xl border-2 border-panelborder bg-white p-1.5 shadow-lg"
              ></div>
              <textarea
                id="chat-input"
                rows="1"
                maxlength="1000"
                autocomplete="off"
                role="combobox"
                aria-expanded="false"
                aria-controls="slash-menu"
                aria-autocomplete="list"
                placeholder="Type an instruction, or / to pick a tool…"
                class="thin-scroll mt-1.5 block w-full resize-none overflow-y-auto border-0 bg-transparent p-0 text-base leading-6 text-ink placeholder:text-placeholder focus:outline-none disabled:opacity-60 sm:text-lg sm:leading-7"
              ></textarea>
              <div class="mt-2 flex items-end justify-between gap-3">
                <p
                  id="hint"
                  class="min-w-0 flex-1 text-xs leading-tight text-hint sm:text-sm"
                >
                  Type / for commands · Enter to send · Shift+Enter for a new line
                </p>
                <button
                  id="send-btn"
                  type="submit"
                  class="shrink-0 cursor-pointer rounded-xl bg-send px-6 py-2.5 text-base font-extrabold text-white transition hover:brightness-110 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-send disabled:cursor-not-allowed disabled:opacity-60 sm:px-7"
                >
                  Send
                </button>
              </div>
            </form>
          </aside>
        </main>
      </div>
    </div>

    <script>
      const SESSION_KEY = "taskflow_session_id";
      const $ = (id) => document.getElementById(id);
      const taskList = $("task-list");
      const taskCount = $("task-count");
      const chipsEl = $("chips");
      const boardCard = $("board-card");
      const chatLog = $("chat-log");
      const chatInput = $("chat-input");
      const sendBtn = $("send-btn");
      const slashMenu = $("slash-menu");
      const hintEl = $("hint");
      const DEFAULT_HINT = hintEl.textContent.replace(/\s+/g, " ").trim();
      const MAX_INPUT_LINES = 3;

      let currentTasks = [];

      function getSessionId() {
        try {
          let id = localStorage.getItem(SESSION_KEY);
          if (!id) {
            id = crypto.randomUUID();
            localStorage.setItem(SESSION_KEY, id);
          }
          return id;
        } catch {
          return crypto.randomUUID();
        }
      }
      const sessionId = getSessionId();

      // Every piece of text goes through esc() before it is placed in HTML.
      function esc(value) {
        return String(value ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      }

      const STATUS_LABEL = {
        todo: "To do",
        in_progress: "In progress",
        done: "Done",
      };
      const PRIORITY = {
        high: { label: "High", cls: "bg-highbg text-high" },
        medium: { label: "Medium", cls: "bg-medbg text-med" },
        low: { label: "Low", cls: "bg-lowbg text-low" },
      };
      const WEEKDAYS = [
        "Sunday",
        "Monday",
        "Tuesday",
        "Wednesday",
        "Thursday",
        "Friday",
        "Saturday",
      ];

      function dueLabel(task) {
        if (task.status === "done") return "Completed";
        if (!task.due_date) return "No due date";
        const [y, m, d] = task.due_date.split("-").map(Number);
        const due = new Date(y, m - 1, d);
        const now = new Date();
        const today = new Date(
          now.getFullYear(),
          now.getMonth(),
          now.getDate(),
        );
        const days = Math.round((due - today) / 86400000);
        if (days === 0) return "Today";
        if (days === 1) return "Tomorrow";
        if (days < 0) return "Overdue";
        if (days < 7) return WEEKDAYS[due.getDay()];
        if (days < 14) return "Next week";
        return due.toLocaleDateString(undefined, {
          month: "short",
          day: "numeric",
        });
      }

      // Status marker: empty ring = to do, half-filled = in progress, check = done.
      function marker(status) {
        const size =
          "h-8 w-8 shrink-0 rounded-full border-2 border-ring @md:h-9 @md:w-9";
        if (status === "done")
          return `<span class="flex ${size} items-center justify-center bg-donecircle text-base font-bold text-check @md:text-lg" role="img" aria-label="Done">✓</span>`;
        if (status === "in_progress")
          return `<span class="${size} bg-[linear-gradient(90deg,var(--color-progress)_50%,var(--color-progressbg)_50%)] border-progress" role="img" aria-label="In progress"></span>`;
        return `<span class="${size} bg-circle" role="img" aria-label="To do"></span>`;
      }

      function taskRow(task, flash = false) {
        const done = task.status === "done";
        const pr = PRIORITY[task.priority] ?? PRIORITY.medium;
        const status = STATUS_LABEL[task.status] ?? task.status;
        const overdue = dueLabel(task) === "Overdue";
        // Rows adapt to the list's own width (container queries), not the window's.
        return `<li data-task-id="${task.id}" class="${flash ? "row-flash " : ""}grid grid-cols-[auto_minmax(0,1fr)] items-center gap-x-3 gap-y-2 rounded-2xl border border-rowborder bg-rowbg px-4 py-3.5 @md:grid-cols-[auto_minmax(0,1fr)_auto] @md:gap-x-4 @md:px-5 @md:py-4 lg:short:py-2.5!">
          ${marker(task.status)}
          <div class="min-w-0">
            <p class="break-words text-base font-extrabold leading-snug @md:text-lg ${done ? "text-donetext" : "text-ink"}">${esc(task.title)}</p>
            <p class="mt-0.5 text-sm ${overdue ? "font-bold text-high" : "text-muted"}">${esc(dueLabel(task))} <span aria-hidden="true">•</span> ${esc(status)}</p>
          </div>
          <span class="col-start-2 justify-self-start rounded-lg px-3.5 py-1.5 text-xs font-extrabold @md:col-start-3 @md:justify-self-end @md:px-4 @md:py-2 @md:text-sm @xl:min-w-[132px] @xl:text-center ${pr.cls}">${esc(pr.label)}</span>
        </li>`;
      }

      // The one place the board is drawn. Open tasks first, done tasks last. With highlight, rows
      // that are new or changed since the last render flash, and the first one is scrolled into view
      // (inside the list only), so a change is visible even when the board is long.
      function renderTasks(tasks, { highlight = false } = {}) {
        const before = new Map(currentTasks.map((t) => [t.id, t.updated_at]));
        const changed = new Set(
          highlight
            ? tasks
                .filter((t) => before.get(t.id) !== t.updated_at)
                .map((t) => t.id)
            : [],
        );
        currentTasks = tasks;
        const ordered = [...tasks].sort(
          (a, b) => (a.status === "done") - (b.status === "done"),
        );
        taskCount.textContent = String(tasks.length);
        taskList.innerHTML = ordered.length
          ? ordered.map((t) => taskRow(t, changed.has(t.id))).join("")
          : `<li class="rounded-2xl border border-dashed border-rowborder bg-rowbg px-5 py-8 text-center text-muted">No tasks yet. Ask the assistant to add one.</li>`;
        if (changed.size) scrollToChanged();
      }

      function scrollToChanged() {
        const row = taskList.querySelector(".row-flash");
        if (!row) return;
        const list = taskList.getBoundingClientRect();
        const box = row.getBoundingClientRect();
        if (box.top < list.top || box.bottom > list.bottom)
          taskList.scrollBy({
            top: box.top - list.top - 8,
            behavior: "smooth",
          });
      }

      // Escape first, then turn **bold** into <strong>. Escaped text has no tags left to abuse.
      function inlineMarkdown(text) {
        return esc(text).replace(
          /\*\*([^*\n]+?)\*\*/g,
          '<strong class="font-extrabold">$1</strong>',
        );
      }

      function showBoard() {
        scrollToChanged();
        boardCard.scrollIntoView({ behavior: "smooth", block: "nearest" });
        boardCard.classList.add("shadow-[0_0_0_4px_#779ce366]");
        setTimeout(
          () => boardCard.classList.remove("shadow-[0_0_0_4px_#779ce366]"),
          1400,
        );
      }

      function addBubble(kind, text, { link = false } = {}) {
        const el = document.createElement("div");
        // shrink-0: a flex child would otherwise be squashed (and clipped) in a full log.
        const base =
          "max-w-[88%] shrink-0 whitespace-pre-wrap break-words rounded-2xl px-4 py-3 text-[15px] leading-snug sm:max-w-[85%]";
        const styles = {
          user: "self-end bg-userbubble text-usertext",
          bot: "self-start border border-botborder bg-white text-bottext",
          thinking:
            "self-start border border-botborder bg-white italic text-muted",
          error: "self-start border border-high/30 bg-highbg text-high",
        };
        el.className = `${base} ${styles[kind]}`;
        if (kind === "bot") el.innerHTML = inlineMarkdown(text);
        else el.textContent = text; // textContent never parses HTML
        if (link) {
          const a = document.createElement("a");
          a.href = "#board-card";
          a.textContent = "View updated task board";
          a.className = "mt-2 block font-bold text-link hover:underline";
          a.addEventListener("click", (event) => {
            event.preventDefault();
            showBoard();
          });
          el.appendChild(a);
        }
        chatLog.appendChild(el);
        chatLog.scrollTop = chatLog.scrollHeight;
        return el;
      }

      const SUGGESTIONS = [
        "Create a high-priority task to finish the demo tomorrow",
        "Show all unfinished tasks related to documentation",
        "Mark the weekly report as done",
      ];
      chipsEl.innerHTML = SUGGESTIONS.map(
        (s) =>
          `<button type="button" data-chip class="shrink-0 cursor-pointer whitespace-nowrap rounded-full border border-botborder bg-white px-3.5 py-1.5 text-xs font-bold text-pilltext transition hover:bg-aihead focus-visible:outline-2 focus-visible:outline-send">${esc(s)}</button>`,
      ).join("");
      chipsEl.addEventListener("click", (event) => {
        const chip = event.target.closest("[data-chip]");
        if (!chip || sendBtn.disabled) return;
        chatInput.value = chip.textContent;
        autosize();
        chatInput.focus();
      });

      // The chat box grows with its text up to three lines, then scrolls inside itself.
      function autosize() {
        chatInput.style.height = "auto";
        const lineHeight = parseFloat(getComputedStyle(chatInput).lineHeight);
        const max = lineHeight * MAX_INPUT_LINES;
        chatInput.style.height = `${Math.min(chatInput.scrollHeight, max)}px`;
      }

      // --- "/" command picker. The entries come from the server. ---
      let commands = [];
      let matches = [];
      let active = 0;

      async function loadCommands() {
        try {
          const res = await fetch("/api/commands");
          if (!res.ok) throw new Error(String(res.status));
          commands = await res.json();
        } catch {
          commands = []; // the picker is a convenience; chat works without it
        }
      }
      loadCommands();

      function menuOpen() {
        return !slashMenu.hidden;
      }

      function closeMenu() {
        slashMenu.hidden = true;
        chatInput.setAttribute("aria-expanded", "false");
        chatInput.removeAttribute("aria-activedescendant");
      }

      function renderMenu() {
        slashMenu.innerHTML = matches
          .map(
            (c, i) =>
              `<div id="cmd-${esc(c.name)}" role="option" data-index="${i}" aria-selected="${i === active}" class="flex cursor-pointer items-baseline gap-3 rounded-xl px-3.5 py-2.5 ${i === active ? "bg-aihead" : "hover:bg-panel"}"><span class="shrink-0 font-extrabold text-send">/${esc(c.name)}</span><span class="min-w-0 truncate text-sm text-muted">${esc(c.summary)}</span></div>`,
          )
          .join("");
        chatInput.setAttribute("aria-activedescendant", `cmd-${matches[active].name}`);
        slashMenu.querySelector('[aria-selected="true"]')?.scrollIntoView({ block: "nearest" });
      }

      // Open while the text is just "/" and the start of a command name, e.g. "/", "/cl".
      function updateMenu() {
        const typed = /^\/([a-z]*)$/i.exec(chatInput.value);
        matches = typed
          ? commands.filter((c) => c.name.startsWith(typed[1].toLowerCase()))
          : [];
        if (!matches.length) return closeMenu();
        active = Math.min(active, matches.length - 1);
        slashMenu.hidden = false;
        chatInput.setAttribute("aria-expanded", "true");
        renderMenu();
      }

      function chooseCommand(command) {
        chatInput.value = `/${command.name}`;
        closeMenu();
        autosize();
        updateHint();
        chatInput.focus();
      }

      // Once /clear is chosen, the hint under the box says what Send will do.
      function updateHint() {
        const clear = /^\/clear$/i.test(chatInput.value.trim());
        hintEl.textContent = clear
          ? "Press Send to clear this chat. Your tasks stay."
          : DEFAULT_HINT;
      }

      slashMenu.addEventListener("mousedown", (event) => {
        event.preventDefault(); // keep the focus in the text box
        const option = event.target.closest("[data-index]");
        if (option) chooseCommand(matches[Number(option.dataset.index)]);
      });

      chatInput.addEventListener("input", () => {
        active = 0;
        autosize();
        updateMenu();
        updateHint();
      });
      chatInput.addEventListener("blur", closeMenu);

      chatInput.addEventListener("keydown", (event) => {
        if (event.isComposing) return; // an input method is still choosing characters
        if (menuOpen()) {
          const step = { ArrowDown: 1, ArrowUp: -1 }[event.key];
          if (step) {
            event.preventDefault();
            active = (active + step + matches.length) % matches.length;
            return renderMenu();
          }
          if (event.key === "Enter" || event.key === "Tab") {
            event.preventDefault();
            return chooseCommand(matches[active]);
          }
          if (event.key === "Escape") {
            event.preventDefault();
            return closeMenu();
          }
        }
        // Enter sends, Shift+Enter adds a new line.
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          $("chat-form").requestSubmit();
        }
      });

      function setBusy(busy) {
        sendBtn.disabled = busy;
        chatInput.disabled = busy;
        if (!busy) chatInput.focus();
      }

      function errorText(res, data) {
        if (res.status === 422)
          return "Messages must be 1 to 1000 characters long.";
        if (data && typeof data.error === "string") return data.error;
        return "Something went wrong. Please try again.";
      }

      async function send() {
        const message = chatInput.value.trim();
        if (!message || sendBtn.disabled) return;
        chatInput.value = "";
        closeMenu();
        autosize();
        updateHint();
        addBubble("user", message);
        setBusy(true);
        const thinking = addBubble("thinking", "Thinking…");
        try {
          const res = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message, session_id: sessionId }),
          });
          const data = await res.json().catch(() => null);
          thinking.remove();
          if (!res.ok || !data) {
            addBubble("error", errorText(res, data));
            return;
          }
          const changed =
            JSON.stringify(data.tasks) !== JSON.stringify(currentTasks);
          renderTasks(data.tasks, { highlight: true });
          if (data.cleared) chatLog.replaceChildren(); // after /clear
          addBubble("bot", data.reply, { link: changed && !data.cleared });
        } catch {
          thinking.remove();
          addBubble(
            "error",
            "Could not reach the server. Check your connection and try again.",
          );
        } finally {
          setBusy(false);
        }
      }

      $("chat-form").addEventListener("submit", (event) => {
        event.preventDefault();
        send();
      });

      async function loadTasks() {
        try {
          const res = await fetch("/api/tasks");
          if (!res.ok) throw new Error(String(res.status));
          renderTasks(await res.json());
        } catch {
          addBubble(
            "error",
            "Could not load your tasks. Please reload the page.",
          );
        }
      }
      loadTasks();

      // Show the earlier conversation of this browser's session after a refresh or restart.
      async function loadHistory() {
        try {
          const res = await fetch(
            `/api/chat/history?session_id=${encodeURIComponent(sessionId)}`,
          );
          if (!res.ok) throw new Error(String(res.status));
          for (const message of await res.json())
            addBubble(message.role === "user" ? "user" : "bot", message.content);
        } catch {
          addBubble("error", "Could not load your earlier chat.");
        }
      }
      loadHistory();
    </script>
  </body>
</html>
