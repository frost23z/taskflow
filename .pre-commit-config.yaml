repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-toml
      - id: check-yaml
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        types_or: [ python, pyi, jupyter, pyproject ]
        args: [ --fix ]
      - id: ruff-format
        types_or: [ python, pyi, jupyter, markdown ]
  - repo: local
    hooks:
      - id: pyrefly
        name: pyrefly
        entry: uvx pyrefly check
        language: system
        types: [python]
        pass_filenames: false
      # - id: pytest
      #   name: pytest
      #   entry: uv run pytest
      #   language: system
      #   types: [python]
      #   pass_filenames: false
